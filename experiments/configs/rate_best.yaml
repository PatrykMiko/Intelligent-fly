# Najlepszy dotąd wariant Rate na małym grafie (docs/eksperymenty.md E21, E25): stan zerowany przed każdą instrukcją,
# AdamW z weight decay 0.05 na WSZYSTKIE parametry (z wykluczeniem gain/bias/alpha_logit/b_out wynik jest gorszy, E25).
# Mechanizm poprawy nie jest wyjaśniony - opisywać jako "Rate z weight decay 0.05 (decay na wszystkie parametry)".
name: rate_best
seed: 0
device: auto
out_dir: runs
task: {seq_len: 16, screen_encoding: onehot_signed, screen_noise: 0.0, legs_mode: teacher, held_x: 6, held_states: 6, val_frac: 0.05, test_frac: 0.10, split_seed: 0}
model:
  name: rate
  inner_steps: 8
  act: tanh
  init_gain: 8.0
  reset_each_step: true
  graph:
    kind: random_layered
    seed: 0
    control: none            # none | degree_preserving | shuffled_weights | no_signs | random_signs
    control_seed: 0
train: {steps: 6000, batch_size: 64, lr: 0.003, grad_clip: 1.0, eval_every: 100, log_every: 50, eval_episodes: 256, weight_decay: 0.05}
