name: rate_small
seed: 0
device: auto
out_dir: runs
task: {seq_len: 16, screen_encoding: onehot_signed, screen_noise: 0.0, legs_mode: teacher, held_x: 6, held_states: 6, val_frac: 0.05, test_frac: 0.10, split_seed: 0}
model:
  name: rate
  inner_steps: 8
  act: tanh
  init_gain: 8.0
  graph:
    kind: random_layered     # mały losowy graf; connectome dojdzie w kroku 7
    seed: 0
    control: none            # none | degree_preserving | shuffled_weights | no_signs | random_signs
    control_seed: 0
train: {steps: 3000, batch_size: 64, lr: 0.003, grad_clip: 1.0, eval_every: 250, log_every: 50, eval_episodes: 256}
